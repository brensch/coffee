[workspace]
resolver = "3"
members = [
    "crates/coffee-io",
    "crates/coffee-board",
    "crates/coffee-api",
    "crates/coffee-node",
    "crates/coffee-core",
    "crates/coffee-engine",
    "crates/coffee-physics",
    "crates/coffee-scenario",
    "crates/coffee-emu",
]
# The ESP32 firmware targets riscv32imac-unknown-none-elf and is built on its own.
exclude = ["firmware/esp32", "ui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
coffee-io = { path = "crates/coffee-io" }
coffee-board = { path = "crates/coffee-board" }
coffee-api = { path = "crates/coffee-api" }
coffee-node = { path = "crates/coffee-node" }
coffee-core = { path = "crates/coffee-core" }
coffee-physics = { path = "crates/coffee-physics" }
coffee-scenario = { path = "crates/coffee-scenario" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libm = "0.2"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
futures = "0.3"

[profile.release]
debug = 1
