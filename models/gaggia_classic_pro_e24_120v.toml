# Gaggia Classic Pro E24 (brass boiler), 120 V / 60 Hz (US/CA).
#
# STATUS: first-principles estimates. Every value here is a starting point for
# `coffee-emu fit` against logs from the real machine. Sources and reasoning are
# in docs/MODELS.md. Values marked (est) have no published source.

[meta]
name = "Gaggia Classic Pro E24 120V"
notes = "Initial estimates; fit thermal.* from a cold heat-up log and hydraulics.* from a blind-basket log."

[mains]
voltage_v = 120.0
frequency_hz = 60.0

[heater]
power_w = 1200.0          # 120 V element rating unverified; fit from a heat-up log
rated_voltage_v = 120.0
cutoff_open_c = 170.0     # bimetal safety cutout on the boiler (est)
cutoff_close_c = 150.0
thermal_fuse_c = 184.0    # one-shot fuse (est)

[thermal]
ambient_c = 22.0
chassis_air_c = 35.0      # inside the case: what a detached probe settles to (est)
boiler_mass_kg = 1.3      # brass, incl. element and group casting (est)
boiler_cp = 380.0         # brass J/(kg K)
boiler_capacity_ml = 136.0
h_boiler_water_w_k = 45.0 # body <-> water conductance, element submerged (est)
h_flow_gain_w_k_per_ml_s = 4.0
loss_boiler_w_k = 0.55    # ~40 W idle at 93 C (est)
portafilter_mass_kg = 0.5 # chromed brass portafilter + basket (est)
portafilter_cp = 380.0
h_boiler_portafilter_w_k = 1.2
loss_portafilter_w_k = 0.25
screen_ua_w_k = 3.0

[hydraulics]
compliance_ml_per_bar = 0.8
opv_crack_bar = 8.6       # US units ship a 9 bar OPV that opens gradually (Gaggiuino docs)
opv_k_ml_s_per_bar = 4.0
opv_softness_bar = 0.9
valve_screen_r = 0.05
wand_liquid_r = 0.6
wand_vapor_g_s_per_bar = 0.6
seep_ml_s_per_bar = 0.003    # check valve / solenoid seepage (est): idle pressure ~2-3 bar while heating, bleeds off over minutes

[pump]
# Ulka E5 datasheet, average flow (cc/min) vs pressure (bar), rated V/Hz.
curve = [[0.0, 650.0], [2.0, 520.0], [4.0, 420.0], [6.0, 350.0], [7.0, 330.0],
         [8.0, 300.0], [10.0, 210.0], [12.0, 140.0], [14.0, 60.0], [15.0, 0.0]]
rated_voltage_v = 120.0
rated_hz = 60.0
wear = 1.0

[puck]
dose_g = 18.0
grind = 1.0
r_per_g = 0.095
compression_per_bar = 0.15
swell_amp = 0.3
swell_tau_s = 5.0
erosion_per_ml = 0.008
headspace_ml = 12.0
absorb_g_per_g = 1.1
solids_c0 = 0.12
solids_decay_ml = 25.0

[cup]
drip_tau_s = 0.4

[scale]
connected = true
period_s = 0.1
latency_s = 0.25
resolution_g = 0.1
noise_g = 0.03

[thermistor]
# 100k B3950 NTC in a brass screw probe, 8.2k 0.1 % reference to 3.3 V,
# read by the ESP32-C6 ADC1 (curve-calibrated, oversampled per mains cycle).
tau_s = 3.0               # bead in a brass probe, heat-sink paste (est); fit from a heat-up log
r25_ohm = 100000.0
beta = 3950.0
r_ref_ohm = 8200.0
v_ref_mv = 3300.0
offset_c = 0.0            # placement / contact error; the two-point calibration removes it
noise_mv = 1.5            # per-cycle average of ~32 samples (est)

[pressure_sensor]
# 0.5-4.5 V ratiometric on 5 V, through a 10k/20k divider (x2/3) to ADC1.
range_bar = 16.0
v_zero_mv = 500.0
v_full_mv = 4500.0
divider = 0.6666667
noise_bar = 0.02
tau_s = 0.003
offset_bar = 0.0          # zero drift of the part; the power-on self-zero removes it

[reservoir]
capacity_ml = 2100.0
initial_ml = 1800.0
temp_c = 22.0

[sim]
substeps = 20
initial_temp_c = 22.0
actuator_delay_cycles = 0  # decision for cycle k drives cycle k+1 (built into lockstep); extra delay here
