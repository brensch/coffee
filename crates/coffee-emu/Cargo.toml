[package]
name = "coffee-emu"
description = "Emulator suite: runs the physics model in lockstep with a separate engine process, scripted scenarios, live lab server, replay and model fitting."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "coffee-emu"
path = "src/main.rs"

[dependencies]
coffee-io.workspace = true
coffee-api.workspace = true
coffee-node.workspace = true
coffee-physics.workspace = true
coffee-scenario.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serialport = { version = "4", default-features = false }
